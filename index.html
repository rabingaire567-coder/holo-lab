<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOLO·LAB — Interactive Electronics Modeling Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hud-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">◉</div>
      <div class="brand-text">
        <h1>HOLO<span>·</span>LAB</h1>
        <p>INTERACTIVE MODELING &amp; IMPACT ANALYSIS</p>
      </div>
    </div>
    <div class="sys-status">
      <div class="status-line"><span class="dot"></span><span id="sys-state">STANDBY</span></div>
      <div class="model-line"><span class="label">ACTIVE MODEL</span><span id="model-name">NONE</span></div>
    </div>
  </header>

  <nav class="toolbar" id="toolbar">
    <div class="tb-group" id="mode-tabs">
      <button class="tb-btn active" data-mode="viewer">◉ HOLO VIEWER</button>
      <button class="tb-btn" data-mode="creator">✧ CREATOR LAB</button>
      <button class="tb-btn" data-mode="studio">✦ 3D DESIGN STUDIO</button>
    </div>
    <div class="tb-group build-only" id="cat-tabs">
      <button class="tb-btn active" data-cat="electronics">⚡ ELECTRONICS</button>
      <button class="tb-btn" data-cat="mechanical">⚙ MECHANICAL</button>
    </div>
    <div class="tb-group creator-only" id="tool-tabs">
      <button class="tb-btn active" data-tool="place">PLACE</button>
      <button class="tb-btn" data-tool="wire">WIRE</button>
      <button class="tb-btn" data-tool="move">MOVE</button>
      <button class="tb-btn" data-tool="rotate">ROTATE</button>
      <button class="tb-btn" data-tool="delete">DELETE</button>
    </div>
    <div class="tb-group studio-only" id="snap-tabs">
      <button class="tb-btn active" id="btn-snap">SNAP ON</button>
      <button class="tb-btn active" id="btn-snap1">1.0</button>
      <button class="tb-btn" id="btn-snap05">0.5</button>
    </div>
    <div class="tb-group build-only" id="action-btns">
      <button class="tb-btn accent" id="btn-simulate">▶ SIMULATE</button>
      <button class="tb-btn" id="btn-example">EXAMPLE</button>
      <button class="tb-btn" id="btn-clear">CLEAR</button>
    </div>
  </nav>

  <main class="stage">
    <section id="viewport" class="viewport">
      <div class="viewport-hud">
        <span>3D HOLOGRAPHIC VIEW</span>
        <span>DRAG · ORBIT &nbsp;|&nbsp; SCROLL · ZOOM &nbsp;|&nbsp; CLICK PART · INSPECT</span>
      </div>
      <div id="info-popup" class="info-popup" hidden></div>
      <div id="quick-actions" class="quick-actions"></div>
      <svg id="workbench" class="workbench" hidden></svg>
      <div id="lab-results" class="lab-results" hidden></div>
      <div id="studio-rail" class="studio-rail studio-only">
        <button class="st-btn active" data-studio-tool="select" title="Select — orbit: drag with MIDDLE mouse">SELECT</button>
        <button class="st-btn" data-studio-tool="place" title="Place selected asset on the grid">PLACE</button>
        <button class="st-btn" data-studio-tool="move" title="Drag to move (snap on)">MOVE</button>
        <button class="st-btn" data-studio-tool="rotate" title="Drag to rotate (15° snap)">ROTATE</button>
        <button class="st-btn" data-studio-tool="scale" title="Drag to scale (0.1 snap)">SCALE</button>
        <button class="st-btn" data-studio-tool="wire" title="Click pin A then pin B">WIRE</button>
        <button class="st-btn danger" data-studio-tool="delete" title="Click an object to delete">DELETE</button>
        <div class="st-rule"></div>
        <button class="st-btn" id="btn-st-desc" title="Show the selected object's documentation">INFO</button>
      </div>
      <div id="studio-hint" class="studio-hint studio-only">SELECT — left-click an object · orbit with MIDDLE mouse · scroll to zoom</div>
    </section>

    <aside class="panel" id="parts-panel">
      <div class="panel-header">
        <span id="panel-title">◈ COMPONENT REGISTRY</span>
        <div id="panel-tabs" class="panel-tabs" hidden>
          <button class="pt-btn active" data-ptab="assets">ASSETS</button>
          <button class="pt-btn" data-ptab="outliner">OUTLINER</button>
          <button class="pt-btn" data-ptab="props">PROPS</button>
        </div>
        <span id="panel-count"></span>
      </div>
      <div id="part-list" class="part-list"></div>
      <div class="panel-footer">
        <span id="legend"></span>
      </div>
    </aside>
  </main>

  <section class="console">
    <div class="console-log" id="console-log" aria-live="polite"></div>
    <form class="console-input" id="console-form" autocomplete="off">
      <span class="prompt">▸</span>
      <input id="console-text" autocomplete="off" spellcheck="false" placeholder="Type a command…  e.g.  create electronics model  ·  remove resistor  ·  what if i remove battery  ·  help" />
      <button type="submit">EXECUTE</button>
    </form>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
